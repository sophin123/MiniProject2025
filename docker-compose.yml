services:
  frontend:
    build:
      context: ./frontend
    container_name: schedule-cleaing-frontend
    # stdin_open: true
    # tty: true
    # ports:
    #   - "5173:5173"
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.220

  nginx:
    image: nginx:alpine
    container_name: schedule-cleaning-nginx
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.221


networks:
  macvlan_net:
    external: true

# To create the macvlan network globally, run the following command:
# docker network create -d macvlan --subnet=192.168.0.0/24 --gateway=192.168.0.1 -o parent=eth0 macvlan_net

