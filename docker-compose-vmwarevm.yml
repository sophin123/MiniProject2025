# Note: Running sites using vm ip address will not work as expected. Alwasy forward your 80 ports through ports forwarding

services:
  backend:
    # If you want to build the backend from source, uncomment the build line
    build: ./backend

    # If you want to use a pre-built image, uncomment the image line
    # image: sophin/fileshare-backend:latest
    container_name: fileshare_backend
    ports:
      - "2000:2000"
    # Uncomment volumes if you want live reload during development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - file-share-backend:/app/uploads
    env_file: .env.development
    environment:
      NODE_ENV: development
      MAX_FILE_SIZE: 20971520
    depends_on:
      mysql:
        condition: service_healthy # Wait until MySQL is healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    # Use custom network for better service isolation

  mysql:
    image: mysql:8.0
    # Reason we explicitly set the .env file is to ensure that it uses the env variables defined in the .env file. Sometime
    env_file: .env.development
    container_name: fileshare_mysql
    ports:
      - "3306:3306"
    volumes:
      - file-share-mysql:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      # Add healthcheck
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      # Make sure to use interval 10s because for some reason the default 5s is not enough for MySQL to be healthy as a result backend and nagios will not start
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
  frontend:
    # If you want to build the frontend from source, uncomment the build line
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev # for development
      args:
        REACT_APP_BASE_URL: /api

    # If you want to use a pre-built image, uncomment the image line
    # image: sophin/fileshare-frontend:latest
    container_name: fileshare_frontend
    stdin_open: true
    tty: true
    # Uncomment ports if you want to use the development server
    ports:
      - "3000:3000"
    env_file: .env.development
    # Uncomment volumes if you want live reload during development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8081:80" # Change port from 80 to 8081 to avoid conflicts with gitlab server 
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  file-share-mysql:
  file-share-backend:
