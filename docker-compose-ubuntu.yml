services:
  backend:
    # If you want to build the backend from source, uncomment the build line
    # build: ./backend

    # If you want to use a pre-built image, uncomment the image line
    image: sophin/fileshare-backend:latest
    container_name: api_backend
    ports:
      - "2000:2000"
    # Uncomment volumes if you want live reload during development
    # volumes:
    #   - ./backend:/app
    #   - /app/node_modules
    volumes:
      - file-share-backend:/app/uploads
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB: ${MYSQL_DATABASE}
      NODE_ENV: production
      MAX_FILE_SIZE: 20971520
    depends_on:
      mysql:
        condition: service_healthy # Wait until MySQL is healthy
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.212

  mysql:
    image: mysql:8.0
    # Reason we explicitly set the .env file is to ensure that it uses the env variables defined in the .env file. Sometime
    env_file: .env
    container_name: mysql
    volumes:
      - file-share-mysql:/var/lib/mysql
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      # Add healthcheck
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-uroot",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      # Make sure to use interval 10s because for some reason the default 5s is not enough for MySQL to be healthy as a result backend and nagios will not start
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.213
  client:
    # If you want to build the frontend from source, uncomment the build line
    # build: ./frontend

    # If you want to use a pre-built image, uncomment the image line
    image: sophin/fileshare-frontend:latest
    container_name: client_frontend
    stdin_open: true
    tty: true
    # Uncomment volumes if you want live reload during development
    # volumes:
    #   - ./frontend:/app
    #   - /app/node_modules
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.211

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - backend
    networks:
      macvlan_net:
        ipv4_address: 192.168.0.210

volumes:
  file-share-mysql:
  file-share-backend:

# If you have already created macvlan network you can use it directly
networks:
  macvlan_net:
    external: true
# To create the macvlan network globally, run the following command:
# docker network create -d macvlan --subnet=192.168.0.0/24 --gateway=192.168.0.1 -o parent=eth0 macvlan_net

# or If you do not want macvlan globally and running for the first time, uncomment the following lines if you want to create a macvlan network
# networks:
#   macvlan_net:
#     driver: macvlan
#     driver_opts:
#       parent: eth0  # ← replace with your actual Wi-Fi interface (like wlp2s0)
#     ipam:
#       config:
#         - subnet: 192.168.0.0/24
#           gateway: 192.168.0.1
